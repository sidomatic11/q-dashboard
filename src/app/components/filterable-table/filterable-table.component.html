<!-- Feel free to replace this placeholder with your filterbar -->
<fieldset class="filter-bar-placeholder">
  <legend>Filter bar should go here</legend>
  <app-filter
    [config]="filterConfig"
    (filterChange)="filterChange.emit($event)"
  ></app-filter>
</fieldset>

<div class="table-wrapper">
  @if (isLoading) {
  <div class="loading-indicator">
    <mat-spinner></mat-spinner>
  </div>
  }

  <table mat-table [dataSource]="dataSource ?? []" class="mat-elevation-z8">
    <ng-content></ng-content>
  </table>

  @if (canLoadMore) {
    <div style="padding: 1rem; text-align: center">
      <button mat-stroked-button type="button" [disabled]="isLoading" (click)="loadMore.emit()">
        Load more
      </button>
    </div>
  }
</div>
